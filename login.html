<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DXS Barbería - Acceso</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login{
  width:90%;
  max-width:400px;
  background:#151515;
  border:1px solid #292929;
  border-radius:18px;
  padding:30px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.logo span{
  color:#999;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:28px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#bbb;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:18px;
  border-radius:9px;
  border:1px solid #333;
  background:#0d0d0d;
  color:white;
  outline:none;
}

input:focus{
  border-color:#777;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:white;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.msg{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

.error{
  color:#ff6b6b;
}

</style>
</head>

<body>

<div class="login">

  <div class="logo">
    DXS <span>BARBERÍA</span>
  </div>

  <p class="subtitle">Acceso al panel privado</p>

  <form id="loginForm">

    <label for="email">Correo</label>
    <input
      id="email"
      type="email"
      placeholder="Tu correo"
      required
    >

    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      placeholder="Tu contraseña"
      required
    >

    <button id="btn" type="submit">
      ENTRAR
    </button>

    <div id="msg" class="msg"></div>

  </form>

</div>

<script>

const SUPABASE_URL="https://jlfyvsmsvaavtmlhvqwb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY="sb_publishable_0j7Unzx2EZxU5o4Q9_NqfA_Sq1nGB8s";

const db=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form=document.getElementById("loginForm");
const email=document.getElementById("email");
const password=document.getElementById("password");
const btn=document.getElementById("btn");
const msg=document.getElementById("msg");

form.addEventListener("submit",async(e)=>{

  e.preventDefault();

  btn.disabled=true;
  msg.textContent="Iniciando sesión...";
  msg.className="msg";

  const {error}=await db.auth.signInWithPassword({
    email:email.value.trim(),
    password:password.value
  });

  if(error){

    msg.textContent="Correo o contraseña incorrectos.";
    msg.className="msg error";

    btn.disabled=false;
    return;
  }

  window.location.href="admin.html";

});

</script>

</body>
</html>
